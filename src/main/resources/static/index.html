<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>📋 Task Manager</h1>
            <button id="btn-new-task" class="btn btn-primary">+ New Task</button>
        </div>
    </header>

    <!-- Toolbar: Search & Filters -->
    <section class="toolbar">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search tasks by title..." />
        </div>
        <div class="filters">
            <select id="filter-status">
                <option value="">All Statuses</option>
                <option value="TODO">To Do</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="DONE">Done</option>
            </select>
            <select id="filter-priority">
                <option value="">All Priorities</option>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
            </select>
        </div>
    </section>

    <!-- Stats Bar -->
    <section class="stats-bar">
        <div class="stat">
            <span class="stat-count" id="stat-total">0</span>
            <span class="stat-label">Total</span>
        </div>
        <div class="stat">
            <span class="stat-count todo" id="stat-todo">0</span>
            <span class="stat-label">To Do</span>
        </div>
        <div class="stat">
            <span class="stat-count in-progress" id="stat-in-progress">0</span>
            <span class="stat-label">In Progress</span>
        </div>
        <div class="stat">
            <span class="stat-count done" id="stat-done">0</span>
            <span class="stat-label">Done</span>
        </div>
        <div class="stat">
            <span class="stat-count overdue" id="stat-overdue">0</span>
            <span class="stat-label">Overdue</span>
        </div>
    </section>

    <!-- Task List -->
    <main class="task-list" id="task-list">
        <!-- Task cards are rendered dynamically by app.js -->
    </main>

    <!-- Empty State -->
    <div class="empty-state" id="empty-state" style="display: none;">
        <span class="empty-icon">📭</span>
        <h2>No tasks found</h2>
        <p>Click "+ New Task" to create your first task.</p>
    </div>

    <!-- Modal: Create / Edit Task -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">New Task</h2>
                <button class="btn-close" id="btn-close-modal">&times;</button>
            </div>
            <form id="task-form">
                <div class="form-group">
                    <label for="input-title">Title <span class="required">*</span></label>
                    <input type="text" id="input-title" maxlength="100" required placeholder="What needs to be done?" />
                    <span class="char-count"><span id="title-chars">0</span>/100</span>
                </div>
                <div class="form-group">
                    <label for="input-description">Description</label>
                    <textarea id="input-description" maxlength="500" rows="3" placeholder="Add more details (optional)"></textarea>
                    <span class="char-count"><span id="desc-chars">0</span>/500</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="input-priority">Priority</label>
                        <select id="input-priority">
                            <option value="LOW">🟢 Low</option>
                            <option value="MEDIUM" selected>🟡 Medium</option>
                            <option value="HIGH">🔴 High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="input-status">Status</label>
                        <select id="input-status">
                            <option value="TODO">To Do</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="DONE">Done</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="input-due-date">Due Date</label>
                    <input type="date" id="input-due-date" />
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-save">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="/js/app.js"></script>
</body>
</html>
